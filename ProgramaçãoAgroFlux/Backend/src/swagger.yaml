openapi: 3.0.0

info:
  title: API AgroFlux
  version: 1.0.0
  description: API de gerenciamento de clientes, produtos, fornecedores, funcionários e estoque

servers:
  - url: http://localhost:3001
    description: Desenvolvimento

  - url: https://api.agroflux.com
    description: Produção

tags:
  - name: Root
  - name: Cliente
  - name: Produto
  - name: Fornecedor
  - name: Funcionário
  - name: Estoque

paths:

  /:
    get:
      tags:
        - Root

      summary: Rota principal da API

      responses:
        '200':
          description: API online

  # ==================== CLIENTE ====================

  /cadastrar-cliente:
    post:
      tags:
        - Cliente

      summary: Cadastrar novo cliente

      security:
        - BearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'

      responses:
        '201':
          description: Cliente cadastrado com sucesso

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-clientes:
    get:
      tags:
        - Cliente

      summary: Listar todos os clientes

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Lista de clientes

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-cliente/{id}:
    get:
      tags:
        - Cliente

      summary: Buscar cliente por ID

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Cliente encontrado

        '404':
          description: Cliente não encontrado

        '500':
          description: Erro interno do servidor

  /pesquisar-cliente:
    get:
      tags:
        - Cliente

      summary: Pesquisar clientes

      security:
        - BearerAuth: []

      parameters:
        - in: query
          name: nome
          schema:
            type: string

      responses:
        '200':
          description: Resultados da pesquisa

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /editar-cliente/{id}:
    put:
      tags:
        - Cliente

      summary: Atualizar cliente

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarCliente'

      responses:
        '200':
          description: Cliente atualizado

        '404':
          description: Cliente não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /deletar-cliente/{id}:
    delete:
      tags:
        - Cliente

      summary: Excluir cliente

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Cliente removido

        '404':
          description: Cliente não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

