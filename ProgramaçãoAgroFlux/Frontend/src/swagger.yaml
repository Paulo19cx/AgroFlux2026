openapi: 3.0.0

info:
  title: API Sistema
  version: 1.0.0
  description: API de gerenciamento de usuários, produtos e colaboradores

servers:
  - url: http://localhost:3001
    description: Desenvolvimento

  - url: https://api.meusistema.com
    description: Produção

tags:
  - name: Root
  - name: Home
  - name: Produto
  - name: Funcionario
  - name: Fornecedor
  - name: Vendas
  - name: Estoque 
  - name: Cliente
  - name: Relatorio

paths:

  /:
    get:
      tags:
        - Root

      summary: Rota principal da API

      responses:
        '200':
          description: API online

  /api/Funcionario:
    post:
      tags:
        - Funcionario

      summary: Cadastrar novo funcionario

      security:
        - BearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Funcionario'

      responses:
        '201':
          description: Funcionario cadastrado com sucesso

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /login:
    post:
      tags:
        - Funcionario

      summary: Realizar login

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'

      responses:
        '200':
          description: Login realizado com sucesso

          content:
            application/json:
              schema:
                type: object

                properties:
                  token:
                    type: string
                    example: JWT_TOKEN

        '401':
          description: Credenciais inválidas

        '500':
          description: Erro interno do servidor

      get:
      tags:
        - Funcionario

      summary: Listar todos os funcionarios

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Lista de funcionarios

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /funcionario/{id}:
    get:
      tags:
        - Funcionario

      summary: Buscar funcionario por ID

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Funcionario encontrado

        '404':
          description: Funcionario não encontrado

        '500':
          description: Erro interno do servidor

    put:
      tags:
        - Funcionario

      summary: Atualizar funcionario

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
