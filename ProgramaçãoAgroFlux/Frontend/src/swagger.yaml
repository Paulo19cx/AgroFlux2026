            schema:
              $ref: '#/components/schemas/AtualizarFuncionario'

      responses:
        '200':
          description: Funcionario atualizado

        '404':
          description: Funcionario não encontrado

        '500':
          description: Erro interno do servidor

    delete:
      tags:
        - Funcionario

      summary: Excluir Funcionario

