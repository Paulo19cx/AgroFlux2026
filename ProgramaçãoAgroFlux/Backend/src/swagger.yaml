        '404':
          description: Produto não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

components:

  securitySchemes:
    
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Funcionario:
      type: object

      required:
        - nome
        - cpf
        - cargo
        - email
        - senha
        - dataNascimento
        - dataContratacao
        - salarioInicial
        - salarioAtual
        - regra
        - situacao
        - numeroTelefone
        - tipoTelefone
        - principal
        - logradouro
        - numero
        - bairro
        - cidade
        - estado
        - cep

      properties:

        nome:
          type: string
          example: João Silva

        cpf:
          type: string
          example: 12345678900

        cargo:
          type: string
          example: Gerente de Vendas

        email:
          type: string
          example: joao.silva@example.com

        senha:
          type: string
          example: senha123

        dataNascimento:
          type: string
          format: date
          example: 1990-05-15

        dataContratacao:
          type: string
          format: date
          example: 2020-01-10

        salarioInicial:
          type: number
          format: float
          example: 3000.00

        salarioAtual:
          type: number
          format: float
          example: 3500.00

        regra:
          type: string
          example: ADMINISTRADOR

        situacao:
          type: string  
          example: ATIVO

        numeroTelefone:
          type: string
          example: 11987654321

        tipoTelefone:
          type: string
          example: Celular

        principal:
          type: string
          example: SIM

        logradouro:
          type: string
          example: Rua das Flores

        numero:
          type: string  
          example: 123

        bairro:
          type: string
          example: Jardim Primavera
        
        cidade:
          type: string
          example: São Paulo

        estado:
          type: string
          example: SP

        cep:
          type: string
          example: 12345678

    AtualizarFuncionario:
      type: object

      required:
        - nome
        - cpf
        - cargo
        - email
        - senha
        - dataNascimento
        - dataContratacao
        - salarioInicial
        - salarioAtual
        - regra
        - situacao
        - numeroTelefone
        - tipoTelefone
        - principal
        - logradouro
        - numero
        - bairro
        - cidade
        - estado
        - cep


      properties:

        nome:
          type: string
          example: João Silva

        cpf:
          type: string
          example: 12345678900

        cargo:
          type: string
          example: Gerente de Vendas

        email:
          type: string
          example: joao.silva@example.com

        senha:
          type: string
          example: novaSenha123

        dataNascimento:
          type: string
          format: date
          example: 1990-05-15

        dataContratacao:
          type: string
          format: date
          example: 2020-01-10

        salarioInicial:
          type: number
          format: float
          example: 3000.00

        salarioAtual:
          type: number
          format: float
          example: 3500.00

        regra:
          type: string
          example: ADMINISTRADOR

        situacao:
          type: string
          example: ATIVO

        numeroTelefone:
          type: string
          example: 11987654321

        tipoTelefone:
          type: string
          example: Celular
        
        principal:
          type: string  
          example: SIM

        logradouro:
          type: string
          example: Rua das Flores

        numero:
          type: string
          example: 123

        bairro:
          type: string
          example: Jardim Primavera

        cidade:
          type: string
          example: São Paulo

        estado:
          type: string
          example: SP

        cep:
          type: string
          example: 12345678

    Cliente:
      type: object

      required:
        - nomeRazaoSocial
        - nomeFantasia
        - cnpj
        - cpf
        - email
        - numeroTelefone
        - tipoTelefone
        - logradouro
        - numero
        - bairro
        - cidade
        - estado
        - cep

      properties:

        nomeRazaoSocial:
          type: string
          example: Empresa ABC Ltda

        nomeFantasia:
          type: string
          example: Empresa ABC

        cnpj:
          type: string
          example: 12345678000190

        cpf:
          type: string
          example: 12345678900 

        email:
          type: string
          example: contato@empresaabc.com

        numeroTelefone:
          type: string
          example: 1133334444

        tipoTelefone:
          type: string
          example: Comercial

        logradouro:
          type: string
          example: Avenida Paulista

        numero:
          type: string
          example: 1000

        bairro:
          type: string
          example: Bela Vista

        cidade:
          type: string
          example: São Paulo

        estado:
          type: string
          example: SP

        cep:
          type: string
          example: 01311100

    AtualizarCliente:
      type: object

      required:
        - nome
        - cnpj
        - email
        - numeroTelefone
        - tipoTelefone
        - logradouro
        - numero
        - bairro
        - cidade
        - estado
        - cep

      properties:

        nome:
          type: string
          example: Empresa ABC Ltda - Matriz

        cnpj:
          type: string
          example: 12345678000190

        email:
          type: string
          example: suporte@empresaabc.com

        numeroTelefone:
          type: string
          example: 1133335555

        tipoTelefone:
          type: string
          example: Comercial

        logradouro:
          type: string
          example: Avenida Paulista

        numero:
          type: string
          example: 1500

        bairro:
          type: string
          example: Bela Vista

        cidade:
          type: string
          example: São Paulo

        estado:
          type: string
          example: SP

        cep:
          type: string
          example: 01311100

    Fornecedor:
      type: object

      required:
        - nome
        - cnpj
        - email
        - numeroTelefone
        - tipoTelefone
        - logradouro
        - numero
        - bairro
        - cidade
        - estado
        - cep

      properties:

        nome:
          type: string
          example: Fornecedora XYZ S/A

        cnpj:
          type: string
          example: 98765432000180

        email:
          type: string
          example: vendas@fornecedoraxyz.com

        numeroTelefone:
          type: string
          example: 1144445555

        tipoTelefone:
          type: string
          example: Comercial

        logradouro:
          type: string
          example: Rua das Indústrias

        numero:
          type: string
          example: 500

        bairro:
          type: string
          example: Zona Industrial

        cidade:
          type: string
          example: Santo André

        estado:
          type: string
          example: SP

        cep:
          type: string
          example: 09080000

    AtualizarFornecedor:
      type: object

      required:
        - nome
        - cnpj
        - email
        - numeroTelefone
        - tipoTelefone
        - logradouro
        - numero
        - bairro
        - cidade
        - estado
        - cep

      properties:

        nome:
          type: string
          example: Fornecedora XYZ S/A - Filial

        cnpj:
          type: string
          example: 98765432000180

        email:
          type: string
          example: contato@fornecedoraxyz.com

        numeroTelefone:
          type: string
          example: 1144446666

        tipoTelefone:
          type: string
          example: Comercial

        logradouro:
          type: string
          example: Rua das Indústrias

        numero:
          type: string
          example: 550

        bairro:
          type: string
          example: Zona Industrial

        cidade:
          type: string
          example: Santo André

        estado:
          type: string
          example: SP

        cep:
          type: string
          example: 09080000

    Produto:
      type: object

      required:
        - nome
        - descricao
        - preco
        - quantidade
        - unidade
        - categoria

      properties:

        nome:
          type: string
          example: Fertilizante NPK 10-10-10

        descricao:
          type: string
          example: Fertilizante completo para cultivos em geral

        preco:
          type: number
          format: float
          example: 125.50

        quantidade:
          type: integer
          example: 500

        unidade:
          type: string
          example: kg

        categoria:
          type: string
          example: Fertilizantes

    AtualizarProduto:
      type: object

      required:
        - nome
        - descricao
        - preco
        - quantidade
        - unidade
        - categoria

      properties:

        nome:
          type: string
          example: Fertilizante NPK 15-10-10

        descricao:
          type: string
          example: Fertilizante concentrado para milho e soja

        preco:
          type: number
          format: float
          example: 135.75

        quantidade:
          type: integer
          example: 450

        unidade:
          type: string
          example: kg

        categoria:
          type: string
          example: Fertilizantes

    Estoque:
      type: object

      required:
        - id_produto
        - quantidade
        - dataAtualizacao
        - localizacao

      properties:

        id_produto:
          type: integer
          example: 1

        quantidade:
          type: integer
          example: 500

        dataAtualizacao:
          type: string
          format: date
          example: 2026-05-26

        localizacao:
          type: string
          example: Galpão A - Prateleira 3
        