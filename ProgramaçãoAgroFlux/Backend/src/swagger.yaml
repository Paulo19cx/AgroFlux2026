openapi: 3.0.0

info:
  title: API AgroFlux
  version: 1.0.0
  description: API de gerenciamento de clientes, produtos, fornecedores, funcionários e estoque

servers:
  - url: http://localhost:3001
    description: Desenvolvimento

  - url: https://api.agroflux.com
    description: Produção

tags:
  - name: Root
  - name: Funcionário
  - name: Cliente
  - name: Fornecedor
  - name: Produto
  - name: Estoque

paths:

  /:
    get:
      tags:
        - Root

      summary: Rota principal da API

      responses:
        '200':
          description: API online

  # ==================== FUNCIONÁRIO ====================

  /cadastrar-funcionario:
    post:
      tags:
        - Funcionário

      summary: Cadastrar novo funcionário

      security:
        - BearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Funcionario'

      responses:
        '201':
          description: Funcionário cadastrado com sucesso

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-funcionarios:
    get:
      tags:
        - Funcionário

      summary: Listar todos os funcionários

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Lista de funcionários

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-funcionario/{id}:
    get:
      tags:
        - Funcionário

      summary: Buscar funcionário por ID

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Funcionário encontrado

        '404':
          description: Funcionário não encontrado

        '500':
          description: Erro interno do servidor

  /pesquisar-funcionario:
    get:
      tags:
        - Funcionário

      summary: Pesquisar funcionários

      security:
        - BearerAuth: []

      parameters:
        - in: query
          name: nome
          schema:
            type: string

      responses:
        '200':
          description: Resultados da pesquisa

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /editar-funcionario/{id}:
    put:
      tags:
        - Funcionário

      summary: Atualizar funcionário

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarFuncionario'

      responses:
        '200':
          description: Funcionário atualizado

        '404':
          description: Funcionário não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /deletar-funcionario/{id}:
    delete:
      tags:
        - Funcionário

      summary: Excluir funcionário

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Funcionário removido

        '404':
          description: Funcionário não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  # ==================== CLIENTE ====================

  /cadastrar-cliente:
    post:
      tags:
        - Cliente

      summary: Cadastrar novo cliente

      security:
        - BearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
             $ref: '#/components/schemas/Cliente'

      responses:
        '201':
          description: Cliente cadastrado com sucesso

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-clientes:
    get:
      tags:
        - Cliente

      summary: Listar todos os clientes

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Lista de clientes

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-cliente/{id}:
    get:
      tags:
        - Cliente

      summary: Buscar cliente por ID

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Cliente encontrado

        '404':
          description: Cliente não encontrado

        '500':
          description: Erro interno do servidor

  /pesquisar-cliente:
    get:
      tags:
        - Cliente

      summary: Pesquisar clientes

      security:
        - BearerAuth: []

      parameters:
        - in: query
          name: nome
          schema:
            type: string

      responses:
        '200':
          description: Resultados da pesquisa

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /editar-cliente/{id}:
    put:
      tags:
        - Cliente

      summary: Atualizar cliente

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarCliente'

      responses:
        '200':
          description: Cliente atualizado

        '404':
          description: Cliente não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /deletar-cliente/{id}:
    delete:
      tags:
        - Cliente

      summary: Excluir cliente

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Cliente removido

        '404':
          description: Cliente não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  # ==================== FORNECEDOR ====================

  /cadastrar-fornecedor:
    post:
      tags:
        - Fornecedor

      summary: Cadastrar novo fornecedor

      security:
        - BearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fornecedor'

      responses:
        '201':
          description: Fornecedor cadastrado com sucesso

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-fornecedores:
    get:
      tags:
        - Fornecedor

      summary: Listar todos os fornecedores

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Lista de fornecedores

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-fornecedor/{id}:
    get:
      tags:
        - Fornecedor

      summary: Buscar fornecedor por ID

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Fornecedor encontrado

        '404':
          description: Fornecedor não encontrado

        '500':
          description: Erro interno do servidor

  /pesquisar-fornecedor:
    get:
      tags:
        - Fornecedor

      summary: Pesquisar fornecedores

      security:
        - BearerAuth: []

      parameters:
        - in: query
          name: nome
          schema:
            type: string

      responses:
        '200':
          description: Resultados da pesquisa

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /editar-fornecedor/{id}:
    put:
      tags:
        - Fornecedor

      summary: Atualizar fornecedor

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarFornecedor'

      responses:
        '200':
          description: Fornecedor atualizado

        '404':
          description: Fornecedor não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /deletar-fornecedor/{id}:
    delete:
      tags:
        - Fornecedor

      summary: Excluir fornecedor

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Fornecedor removido

        '404':
          description: Fornecedor não encontrado

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  # ==================== PRODUTO ====================

  /cadastrar-produto:
    post:
      tags:
        - Produto

      summary: Cadastrar novo produto

      security:
        - BearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'

      responses:
        '201':
          description: Produto cadastrado com sucesso

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-produtos:
    get:
      tags:
        - Produto

      summary: Listar todos os produtos

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Lista de produtos

        '401':
          description: Token inválido ou não informado

        '500':
          description: Erro interno do servidor

  /listar-produto/{id}:
    get:
      tags:
        - Produto

      summary: Buscar produto por ID

      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true

          schema:
            type: integer

      responses:
        '200':
          description: Produto encontrado

        '404':
          description: Produto não encontrado

        '500':
          description: Erro interno do servidor

  /pesquisar-produto:
    get:
      tags:
        - Produto

      summary: Pesquisar produtos

      security:
        - BearerAuth: []

      parameters:
        - in: query
          name: nome
          schema:
            type: string

      responses:
        '200':
