# trocar o "todos" em vendas⚠️⚠️⚠️

components:

  securitySchemes:

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Funcionario:
      type: object

      required:
        - nome
        - email
        - senha

      properties:

        nome:
          type: string
          example: João Silva

        email:
          type: string
          example: joao@email.com

        senha:
          type: string
          example: 123456

    Login:
      type: object

      required:
        - email
        - senha

      properties:

        email:
          type: string
          example: joao@email.com

        senha:
          type: string
          example: 123456

    Produto:
      type: object

      required:
        - nome
        - quantidade
        - valor
        - codigo

      properties:

        nome:
          type: string
          example: Notebook Gamer

        quantidade:
          type: integer
          example: 100

        valor:
          type: number
          example: 5500

        codigo:
          type: string
          example: "102030"

    AtualizarProduto:
      type: object

      properties:

        nome:
          type: string
          example: Notebook Atualizado

        preco:
          type: number
          example: 7000

    Colaborador:
      type: object

      required:
        - id_usuario
        - nome
        - idade
        - cidade
        - estado
        - bairro
        - nf

      properties:

        id_usuario:
          type: integer
          example: 1

        nome:
          type: string
          example: Maria

        idade:
          type: integer
          example: 30

        cidade:
          type: string
          example: São Paulo

        estado:
          type: string
          example: SP

        bairro:
          type: string
          example: Centro

        nf:
          type: string
          example: "123456"